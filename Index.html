<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mail Sender</title>
<style>
  body{font-family:system-ui,sans-serif;background:#111;color:#eee;display:flex;justify-content:center;padding:40px}
  form{background:#1b1b1b;padding:24px;border-radius:10px;width:100%;max-width:520px}
  label{display:block;margin:10px 0 4px;font-size:13px;color:#aaa}
  input,textarea{width:100%;padding:9px;border:1px solid #333;border-radius:6px;background:#0d0d0d;color:#eee;font-size:14px}
  textarea{height:140px;resize:vertical}
  button{margin-top:14px;width:100%;padding:11px;border:0;border-radius:6px;background:#2d7;color:#041;font-weight:700;cursor:pointer}
  button:disabled{background:#444;color:#888;cursor:not-allowed}
  #out{margin-top:12px;font-size:13px;white-space:pre-wrap}
</style>
</head>
<body>
<form id="f">
  <label>From Name</label>
  <input name="from_name" placeholder="Support Team" required>
  <label>From Email (spoofed)</label>
  <input name="from_email" type="email" placeholder="billing@example.com" required>
  <label>Reply-To (optional)</label>
  <input name="reply_to" type="email" placeholder="you@yourdomain.com">
  <label>To</label>
  <input name="to" type="email" required>
  <label>Subject</label>
  <input name="subject" required>
  <label>Message (HTML allowed)</label>
  <textarea name="message" required></textarea>
  <button id="b" type="submit">Send</button>
  <div id="out"></div>
</form>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('b'), out = document.getElementById('out');
  btn.disabled = true; btn.textContent = 'Sending…'; out.textContent = '';
  try {
    const r = await fetch('send.php', { method: 'POST', body: new FormData(e.target) });
    const j = await r.json();
    out.textContent = j.ok ? 'Sent.' : 'Failed: ' + j.error;
  } catch (err) { out.textContent = 'Error: ' + err.message; }
  btn.disabled = false; btn.textContent = 'Send';
});
</script>
</body>
</html>
