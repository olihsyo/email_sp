<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mail Bomber</title>
<style>
  body{font-family:system-ui,sans-serif;background:#111;color:#eee;display:flex;justify-content:center;padding:40px}
  form{background:#1b1b1b;padding:24px;border-radius:10px;width:100%;max-width:520px}
  label{display:block;margin:10px 0 4px;font-size:13px;color:#aaa}
  input,textarea{width:100%;padding:9px;border:1px solid #333;border-radius:6px;background:#0d0d0d;color:#eee;font-size:14px}
  textarea{height:100px;resize:vertical}
  button{margin-top:14px;width:100%;padding:11px;border:0;border-radius:6px;background:#e24;color:#fff;font-weight:700;cursor:pointer}
  button:disabled{background:#444;color:#888}
  #out{margin-top:12px;font-size:13px;white-space:pre-wrap;color:#2d7}
</style>
</head>
<body>
<form id="f">
  <label>Target Email</label>
  <input name="target" type="email" placeholder="victim@gmail.com" required>
  <label>Subject</label>
  <input name="subject" placeholder="Important Alert" required>
  <label>Message</label>
  <textarea name="message" placeholder="Your message here..." required></textarea>
  <label>Count (How many times)</label>
  <input name="count" type="number" value="10" min="1" max="100" required>
  <button id="b" type="submit">Start Bombing</button>
  <div id="out"></div>
</form>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('b'), out = document.getElementById('out');
  btn.disabled = true; btn.textContent = 'Bombing…'; out.textContent = 'Starting...';
  try {
    const r = await fetch('bomb.php', { method: 'POST', body: new FormData(e.target) });
    const j = await r.json();
    out.textContent = j.ok ? 'Success: ' + j.sent + ' emails sent.' : 'Failed: ' + j.error;
  } catch (err) { out.textContent = 'Error: ' + err.message; }
  btn.disabled = false; btn.textContent = 'Start Bombing';
});
</script>
</body>
</html>
